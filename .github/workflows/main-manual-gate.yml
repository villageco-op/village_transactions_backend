name: Manual Release Checklist Gate

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  pull-requests: write

jobs:
  verify-checklist:
    runs-on: ubuntu-latest
    steps:
      - name: Auto-insert release checklist if missing
        if: github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const currentBody = (context.payload.pull_request.body || '').trim();

            const checklist = [
              '## Release to `main` — Manual Verification Gate',
              '- [ ] **Magic Link Sign In:** Sign in with a new or existing account using magic link.',
              '- [ ] **Create an Order:** Create an order for a listing.',
              '- [ ] **Create a subscription:** Create a subscription for a listing.',
            ].join('\n');

            if (!currentBody.includes('Release to `main` — Manual Verification Gate')) {
              const updatedBody = currentBody ? `${currentBody}\n\n${checklist}` : checklist;
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number,
                body: updatedBody
              });
              context.payload.pull_request.body = updatedBody;
            }

      - name: Check for unchecked manual test items
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const unchecked = body.match(/^\s*-\s*\[\s\]\s+.+$/gm) || [];
            const checked = body.match(/^\s*-\s*\[[xX]\]\s+.+$/gm) || [];

            if (checked.length === 0 && unchecked.length === 0) {
              core.setFailed('Manual release checklist is missing from the PR description.');
              return;
            }

            if (unchecked.length > 0) {
              core.setFailed(
                `${unchecked.length} manual test item(s) still unchecked:\n` +
                unchecked.join('\n')
              );
            } else {
              console.log(`All ${checked.length} manual release checks passed.`);
            }
